{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card">
    <div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to view your dashboard</p>
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input type="email" name="email" placeholder="you@example.com" required></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" name="password" placeholder="••••••••" required></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Register</a></div>
  </div>
</div>
{% endblock %}
