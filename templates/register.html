{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card">
    <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
    <h2>Create Account</h2>
    <p class="subtitle">Start tracking your placement readiness today</p>
    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrap"><i class="fa-solid fa-user"></i><input type="text" name="name" placeholder="John Doe" required></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input type="email" name="email" placeholder="you@example.com" required></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" name="password" placeholder="••••••••" required minlength="6"></div>
        <div class="form-hint">Minimum 6 characters</div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" name="confirm_password" placeholder="••••••••" required minlength="6"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <div class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></div>
  </div>
</div>
{% endblock %}
